; PlatformIO project configuration
; The sketch stays in matrix/ so it still opens in the Arduino IDE.

[platformio]
src_dir = matrix
default_envs = nanoatmega328

[env]
platform = atmelavr@5.3.0
framework = arduino
monitor_speed = 19200
build_flags = -Wall

; Arduino Nano V3.0 (ATmega328P, old bootloader)
[env:nanoatmega328]
board = nanoatmega328

; Arduino Nano V3.0 (ATmega328P, new Optiboot bootloader)
[env:nanoatmega328new]
board = nanoatmega328new

; Arduino Mini (ATmega168)
[env:miniatmega168]
board = miniatmega168
